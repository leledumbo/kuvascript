-- A small photobook to try kuvascript on:  bin/kuvascript examples/hello
title Hello, kuvascript
-- A cover is cut to one cell box (400x600 below), whatever the layout. It takes a crop
-- like pic does: this one keeps the left part, so the "TL" corner label stays visible.
front crop TL cover.jpg
-- a caption goes right after its cover: top, middle or bottom, then the text
caption middle Hello,\nkuvascript
-- a subcaption has no position, it is drawn right below the caption in smaller letters
subcaption a tiny photobook

-- the back cover is the same, here keeping the right part and writing at the bottom
back crop BR end.jpg
caption bottom The end \\o/

-- a page holds 2 rows x 2 columns of cells
layout rows 2 columns 2
-- every cell is as big as the larger of the two sizes (400x600);
-- landscape pictures are centered in it
portrait width 400 height 600
landscape width 400 height 300

chapter Pictures

-- crop says which part of a picture is kept when it does not fit
pic portrait1.jpg
pic crop TL portrait2.jpg
pic crop BR portrait3.jpg
pic landscape1.jpg

chapter Words\nand more

text Captions can be\nfew lines long.
pic landscape2.jpg
-- a bare text is a blank cell, e.g. a place to sign
text
pic crop TR landscape3.jpg

pic portrait4.jpg
pic portrait5.jpg
pic landscape4.jpg
text The end \\o/
